openapi: 3.1.0
info:
  title: WhitePaper English API
  version: 0.1.0
  description: >-
    Snapshot of the currently implemented business API. Hono AppType and route
    source remain the executable type truth. The vocabulary sync API in api.md
    is an adopted target until its implementation Plan and evidence complete.
servers:
  - url: http://localhost:3000
    description: Local development
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        '200':
          description: Service is available
          content:
            application/json:
              schema:
                type: object
                required: [status, timestamp]
                properties:
                  status:
                    type: string
                    const: ok
                  timestamp:
                    type: string
                    format: date-time
  /api/vocabulary/state:
    get:
      operationId: getVocabularyState
      summary: Read the current user's vocabulary state boundary
      description: >-
        Requires the Better Auth session cookie. Returns the signed-in
        account's saved word states; a new account gets an empty list.
      responses:
        '200':
          description: Current vocabulary state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [activeBook, wordStates]
                    properties:
                      activeBook:
                        type: ['object', 'null']
                        additionalProperties: true
                      wordStates:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          required: [word, known]
                          properties:
                            word:
                              type: string
                            known:
                              type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/vocabulary/judgements:
    post:
      operationId: saveVocabularyJudgements
      summary: Save a page of judgements for the signed-in account
      description: >-
        Requires the Better Auth session cookie. Upserts up to 36 word states
        for the current account; resubmitting a word overwrites its value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [judgements]
              properties:
                judgements:
                  type: array
                  minItems: 1
                  maxItems: 36
                  items:
                    type: object
                    additionalProperties: false
                    required: [word, known]
                    properties:
                      word:
                        type: string
                      known:
                        type: boolean
      responses:
        '200':
          description: Saved vocabulary state
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [activeBook, wordStates]
                    properties:
                      activeBook:
                        type: ['object', 'null']
                        additionalProperties: true
                      wordStates:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          required: [word, known]
                          properties:
                            word:
                              type: string
                            known:
                              type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /api/tasks:
    get:
      operationId: listTasks
      summary: List tasks owned by the current user
      description: Requires the Better Auth session cookie.
      responses:
        '200':
          description: Task list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createTask
      summary: Create a task for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskInput'
      responses:
        '200':
          description: Created task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/InvalidInput'
  /api/tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    put:
      operationId: updateTask
      summary: Update a task owned by the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskInput'
      responses:
        '200':
          description: Updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidInput'
    delete:
      operationId: deleteTask
      summary: Delete a task owned by the current user
      responses:
        '200':
          description: Deleted task id
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id]
                    properties:
                      id:
                        type: string
                        format: uuid
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidInput'
components:
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Task:
      type: object
      required: [id, title, completed, userId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        completed: { type: boolean }
        userId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateTaskInput:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
    UpdateTaskInput:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        completed: { type: boolean }
    TaskResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Task' }
    TaskListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Task' }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer }
        message: { type: string }
  responses:
    Unauthorized:
      description: No authenticated session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Resource does not exist or is not owned by the current user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidInput:
      description: Request validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
